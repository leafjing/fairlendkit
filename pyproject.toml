[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fairlendkit"
version = "0.1.0.dev0"
description = "Reproducible fairness audits for credit underwriting models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pandas>=2.1",
  "pydantic>=2.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fairlendkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]

